name: lumina_photography
description: "A premium portfolio website for Lumina Photography."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.5
  go_router: ^18.1.4
  flutter_animate: ^4.0.0
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.3
  url_launcher: ^6.1.12
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
